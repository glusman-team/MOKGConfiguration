template:

  source:
    kind: excel
    local: ./DATALAKE/WAINBERG3.xlsx
    url:
      - https://pmc.ncbi.nlm.nih.gov/articles/instance/7474629/bin/pnas.2001429117.sd03.xlsx

  statement:
    subject:
      method: column
      encoding: B
      prioritize:
        - Protein
      regex:
        - pattern: " \\([^)]+\\)$"
          replacement: ""
    predicate: correlated_with
    object:
      method: column
      encoding: A
      prioritize:
        - DiseaseOrPhenotypicFeature
        - PhenotypicFeature
        - Disease

  provenance:
    repo: PMC
    publication: PMC7474629

  annotations:
    - annotation: relationship_strength
      method: column
      encoding: C
    - annotation: p_value
      method: column
      encoding: D
    - annotation: sample_size
      method: value
      encoding: 6434
    - annotation: assertion_method
      method: value
      encoding: correlation

sections:
  - source:
      sheet: "Proteomics, by disease"
      row_slice:
        - 1
        - auto
    statement:
      subject:
        method: column
        encoding: B
      object:
        method: column
        encoding: A

  - source:
      sheet: "Proteomics, by analyte"
      row_slice:
        - 1
        - auto
    statement:
      subject:
        method: column
        encoding: A
      object:
        method: column
        encoding: B
