template:
  source:
    url:
      - https://pmc.ncbi.nlm.nih.gov/articles/instance/8980904/bin/PHY2-10-e15254-s002.xlsx
    local: ./DATALAKE/BOMBIN1.xlsx
    kind: excel
    row_slice:
      - 2
      - auto
  statement:
    subject:
      method: column
      encoding: B
      regex:
        - pattern: ^K
          replacement: KEGG.ORTHOLOGY:K
        - pattern: ^k
          replacement: KEGG.ORTHOLOGY:k
    predicate: correlated_with
    object:
      method: column
      encoding: C
      prioritize:
        - ChemicalEntity
        - SmallMolecule
        - Drug
        - PhenotypicFeature
        - Drug
      regex:
        - pattern: ^Plasma_
          replacement: ""
        - pattern: ^Stool_
          replacement: ""
        - pattern: ^K
          replacement: KEGG.ORTHOLOGY:K
        - pattern: ^k
          replacement: KEGG.ORTHOLOGY:k
      remove:
        - \*+$
        - ' \[[^\[\]]*\]$'
        - ' \([^()]*\)$'
        - /.*$
        - ;.*$
        - "]"
        - '\['
    qualifiers:
      - qualifier: disease_context_qualifier
        method: value
        encoding: MONDO:0011122
      - qualifier: anatomical_context_qualifier
        method: value
        encoding: UMLS:C1956108 # MICROBIOM
  provenance:
    repo: PMC
    publication: PMC8980904
  annotations:
    - annotation: p value
      method: column
      encoding: G
    - annotation: source label
      method: column
      encoding: F
    - annotation: multiple testing correction method
      method: value
      encoding: Benjamini Hochberg
    - annotation: assertion method
      method: value
      encoding: Spearman correlation

sections:
  - source:
      sheet: S9A
    annotations:
