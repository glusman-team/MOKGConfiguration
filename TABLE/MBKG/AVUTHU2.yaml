template:
  source:
    url: https://pmc.ncbi.nlm.nih.gov/articles/instance/9431300/bin/spectrum.00013-22-s0003.xlsx
    local: ./DATALAKE/AVUTHU2.xlsx
    kind: excel
    sheet: Rel_abundance_top20species
    row_slice:
      - 62
      - auto
  statement:
    subject:
      method: column
      encoding: A
      regex:
        - pattern: " unclassified$"
          replacement: " sp."
        - pattern: " sp .*?$"
          replacement: " sp."
      prioritize:
        - OrganismTaxon
    predicate: associated_with
    object:
      method: column
      encoding: C
      avoid:
        - OrganismTaxon
      regex:
        - pattern: ^Washington,DC$
          replacement: United States of America
    qualifiers:
      - qualifier: disease_context_qualifier
        method: value
        encoding: MONDO:0005575
  provenance:
    repo: PMC
    publication: PMC9431300
  annotations:
    - annotation: multiple testing correction method
      method: value
      encoding: Benjamini Hochberg
    - annotation: relationship strength
      method: column
      encoding: B
    - annotation: assertion method
      method: value
      encoding: Relative abundance
    - annotation: miscellaneous notes
      method: value
      encoding: Top 20 relative-abundance species in CRC samples from China, United States of America, and France datasets.
