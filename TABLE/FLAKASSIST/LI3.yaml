template:
  source:
    kind: excel
    local: ./DATALAKE/PMC12835233_Table_5.xlsx
    url:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC12835233/
    sheet: Sheet1
    row_slice:
      - 1
      - auto
  statement:
    subject:
      method: column
      encoding: A
      prefix: "UniProtKB:"
      prioritize:
        - Protein
    predicate: correlated_with
    object:
      method: column
      encoding: D
  provenance:
    repo: PMC
    publication: PMC12835233
  annotations:
    - annotation: coefficient
      method: column
      encoding: G
    - annotation: pvalue
      method: column
      encoding: H
    - annotation: log2fc_prot
      method: column
      encoding: B
    - annotation: log2fc_meta
      method: column
      encoding: E
    - annotation: regulation_prot
      method: column
      encoding: C
    - annotation: regulation_meta
      method: column
      encoding: F
